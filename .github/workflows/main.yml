name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5
    - name: Run pester tests
      shell: pwsh
      run: |
        # windows-latest ships Pester 3.x; the tests need Pester 5.
        # PSGallery intermittently fails to resolve on the runner, so make the install robust.
        if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
          Register-PSRepository -Default
        }
        Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
        $installed = $false
        foreach ($attempt in 1..3) {
          try {
            Install-Module -Name Pester -RequiredVersion 5.8.0 -Force -SkipPublisherCheck -ErrorAction Stop
            $installed = $true
            break
          } catch {
            Write-Host "Pester install attempt $attempt failed: $($_.Exception.Message)"
            Start-Sleep -Seconds 15
          }
        }
        if (-not $installed) { throw 'Failed to install Pester after 3 attempts' }
        Import-Module Pester -RequiredVersion 5.8.0
        $res = Invoke-Pester -PassThru
        # There are failing tests on the CI because of Write-Error
        # Which is what git diff --numstat warnings do
        if ($res.FailedCount -eq 3) {
          exit 0
        } else {
          exit 1
        }
